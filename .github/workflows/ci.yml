name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: raglab
          POSTGRES_PASSWORD: raglab
          POSTGRES_DB: raglab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raglab" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://raglab:raglab@localhost:5432/raglab_test
      TEST_DATABASE_URL: postgresql+asyncpg://raglab:raglab@localhost:5432/raglab_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
