[project]
name = "raglab"
version = "0.1.0"
description = "Ask your PDFs by voice: FastAPI + Postgres/pgvector RAG with local CLIs or API keys"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pymupdf>=1.25",
    "fastembed>=0.4",
    "anthropic>=0.75",
    "openai>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Postgres with pgvector (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["SIM905"]  # word lists read better as split strings

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[project.scripts]
raglab = "raglab.main:run"
raglab-worker = "raglab.worker:cli"
